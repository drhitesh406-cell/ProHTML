<style>
:root{
  --bg:#f2f2f7;--card:#ffffff;--ink:#0b0b0f;--mut:#8a8a8f;--line:#e4e4ea;--accent:#2d6ae3;--accent-soft:#e8f0fe;
  --pill:#ffffff;--pill-on:#e8e8ee;--dark-btn:#000000;--dark-btn-ink:#ffffff;--bar:rgba(246,246,249,.86);--shadow:0 6px 24px rgba(0,0,0,.14);--bad:#d33a2c;
  --ui:-apple-system,BlinkMacSystemFont,'SF Pro Text','Segoe UI',Roboto,'Noto Sans','Noto Sans Devanagari','Noto Sans Arabic','Noto Sans CJK SC',sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#000000;--card:#1c1c1e;--ink:#f5f5f7;--mut:#8e8e93;--line:#38383a;--accent:#6ea0ff;--accent-soft:#1b2944;
  --pill:#1c1c1e;--pill-on:#2c2c2e;--dark-btn:#ffffff;--dark-btn-ink:#000000;--bar:rgba(28,28,30,.86);--shadow:0 6px 24px rgba(0,0,0,.6);--bad:#ff6b5e;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#000000;--card:#1c1c1e;--ink:#f5f5f7;--mut:#8e8e93;--line:#38383a;--accent:#6ea0ff;--accent-soft:#1b2944;
  --pill:#1c1c1e;--pill-on:#2c2c2e;--dark-btn:#ffffff;--dark-btn-ink:#000000;--bar:rgba(28,28,30,.86);--shadow:0 6px 24px rgba(0,0,0,.6);--bad:#ff6b5e;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:17px/1.35 var(--ui);overflow:hidden;-webkit-text-size-adjust:100%;-webkit-user-select:none;user-select:none;overscroll-behavior:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
input{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
svg.i{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* ---------- library screen ---------- */
#home{position:fixed;inset:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:calc(10px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(40px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.wrapin{max-width:1100px;margin:0 auto}
.nav{display:flex;align-items:center;gap:12px;flex-wrap:wrap;justify-content:space-between;padding:6px 0 4px}
.tabs{display:flex;background:var(--pill);border-radius:999px;padding:4px;box-shadow:0 2px 14px rgba(0,0,0,.07);margin:0 auto 0 0;max-width:100%;overflow-x:auto;-webkit-overflow-scrolling:touch}
.font-slider{padding:12px 16px 14px}.font-slider .font-label{display:flex;align-items:center;justify-content:space-between;margin:0 0 8px;font-size:15px;color:var(--mut)}.font-slider output{font-size:18px;color:var(--ink);font-weight:700;font-variant-numeric:tabular-nums}.font-slider input[type=range]{width:100%;accent-color:var(--accent);height:28px;cursor:pointer}
.tabs button{height:44px;padding:0 22px;border-radius:999px;font-weight:500;font-size:18px;white-space:nowrap}
.tabs button[aria-selected="true"]{background:var(--pill-on);color:var(--accent);font-weight:600}
.right{display:flex;gap:12px;align-items:center;flex:1 1 280px;justify-content:flex-end}
.addpill{display:flex;align-items:center;gap:8px;background:var(--pill);border-radius:999px;padding:4px;box-shadow:0 2px 14px rgba(0,0,0,.07)}
.addpill .n{background:var(--pill-on);color:var(--mut);border-radius:999px;padding:5px 12px;font-weight:600;font-size:15px}
.plus{width:44px;height:44px;border-radius:50%;background:var(--dark-btn);color:var(--dark-btn-ink);display:grid;place-items:center}
.plus svg{width:24px;height:24px;stroke-width:2.4}
.search{flex:1 1 180px;max-width:420px;display:flex;align-items:center;gap:10px;background:var(--pill);border-radius:999px;padding:0 18px;height:52px;box-shadow:0 2px 14px rgba(0,0,0,.07);color:var(--mut)}
.search input{flex:1;min-width:0;border:0;background:none;outline:none;-webkit-user-select:text;user-select:text;font-size:18px;color:var(--ink)}
.search input::placeholder{color:var(--mut)}
h1{font-size:40px;line-height:1.1;margin:34px 4px 18px;font-weight:800;letter-spacing:-.02em}
.card{background:var(--card);border-radius:28px;overflow:hidden}
.row{display:flex;align-items:center;gap:18px;width:100%;text-align:left;padding:16px 22px 16px 22px;position:relative}
.row:active{background:var(--pill-on)}
.row+.row::before{content:"";position:absolute;top:0;left:96px;right:22px;border-top:1px solid var(--line)}
.fi{width:56px;height:56px;border-radius:15px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;flex:none}
.fi svg{width:28px;height:28px}
.tx{flex:1;min-width:0}
.nm{font-size:21px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block}
.sz{color:var(--mut);font-size:16px}
svg.i.star{color:#f4a600;width:20px;height:20px;fill:#f4a600;margin-right:2px}
.chev{color:var(--mut);opacity:.7;width:20px;height:20px}
.empty{padding:56px 24px;text-align:center;color:var(--mut)}
.empty b{display:block;color:var(--ink);font-size:22px;margin-bottom:6px}
.empty .big{margin-top:18px;display:inline-flex;gap:8px;align-items:center;background:var(--dark-btn);color:var(--dark-btn-ink);height:48px;padding:0 24px;border-radius:999px;font-weight:600}
.tip{margin:18px 6px;color:var(--mut);font-size:15px;display:flex;gap:10px;align-items:flex-start}
.tip button{margin-left:auto;color:var(--accent);font-weight:600}
.fi.dir{background:color-mix(in srgb,#f4a600 18%,transparent);color:#e39a00}
.crumb{display:inline-flex;align-items:center;gap:2px;height:40px;margin:2px 0 8px 2px;color:var(--accent);font-weight:600;font-size:19px}
.crumb svg{width:22px;height:22px;transform:scaleX(-1)}
.nm,.sz{max-width:100%}
.sz.p{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* progress badges + filter chips */
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:0 2px 14px}
.chips .chip{height:38px;padding:0 16px;border-radius:999px;background:var(--pill);box-shadow:0 2px 10px rgba(0,0,0,.06);font-weight:500;font-size:16px;white-space:nowrap}
.chips .chip[aria-pressed="true"]{background:var(--accent);color:#fff;font-weight:600}
.row.rdone{background:color-mix(in srgb,#34c759 13%,var(--card))}
.row.rdone:active{background:var(--pill-on)}
.fi.ok{background:color-mix(in srgb,#34c759 22%,transparent);color:#1f9d4a}
.pg{display:flex;flex-direction:column;align-items:flex-end;flex:none;line-height:1.15;margin-left:6px;text-align:right}
.pg b{font-size:20px;font-weight:700;font-variant-numeric:tabular-nums}
.pg small{font-size:13px;color:var(--mut)}
.pg.done b{color:#1f9d4a}.pg.prog b{color:#e39a00}
/* settings */
.sec{margin:0 0 22px}
.sec h2{font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--mut);margin:0 0 8px 18px;font-weight:600}
.set{display:flex;align-items:center;gap:14px;padding:15px 20px;min-height:56px;width:100%;text-align:left}
.set+.set{border-top:1px solid var(--line)}
.set .lb{flex:1}.set .lb small{display:block;color:var(--mut);font-size:14px;margin-top:2px}
.seg{display:inline-flex;background:var(--pill-on);border-radius:10px;padding:3px}
.seg button{padding:6px 14px;border-radius:8px;font-size:15px;font-weight:500}
.seg button[aria-pressed="true"]{background:var(--card);box-shadow:0 1px 4px rgba(0,0,0,.18)}
.sw{position:relative;width:52px;height:32px;flex:none}
.sw input{position:absolute;inset:0;opacity:0;margin:0;width:100%;height:100%;cursor:pointer}
.sw i{position:absolute;inset:0;background:var(--pill-on);border-radius:99px;transition:background .18s}
.sw i::after{content:"";position:absolute;left:3px;top:3px;width:26px;height:26px;border-radius:50%;background:#fff;box-shadow:0 2px 5px rgba(0,0,0,.3);transition:transform .18s}
.sw input:checked+i{background:#34c759}
.sw input:checked+i::after{transform:translateX(20px)}
.sw input:focus-visible+i{outline:3px solid var(--accent);outline-offset:2px}
.danger{color:var(--bad);font-weight:600}
select.sel{background:var(--pill-on);border:0;border-radius:10px;padding:8px 12px;font-size:16px;color:var(--ink)}

/* ---------- reader ---------- */
#reader{position:fixed;inset:0;z-index:50;background:var(--bg)}
#reader[hidden]{display:none}
#rbar{position:absolute;left:0;right:0;top:0;z-index:5;display:flex;align-items:center;gap:12px;height:calc(64px + env(safe-area-inset-top,0px));padding:env(safe-area-inset-top,0px) max(14px,env(safe-area-inset-right,0px)) 0 max(14px,env(safe-area-inset-left,0px));background:var(--bar);-webkit-backdrop-filter:saturate(180%) blur(24px);backdrop-filter:saturate(180%) blur(24px);border-bottom:1px solid var(--line);transition:transform .22s}
#rbar .t{flex:1;text-align:center;font-weight:700;font-size:18px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.circ{width:46px;height:46px;border-radius:50%;background:var(--card);display:grid;place-items:center;box-shadow:0 2px 12px rgba(0,0,0,.14);flex:none}
#rframe{position:absolute;left:0;right:0;bottom:0;top:calc(64px + env(safe-area-inset-top,0px));background:#fff;transition:top .22s;overflow:hidden}
#rframe iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#fff}
#reader.hide-bar #rbar{transform:translateY(-110%)}
#reader.hide-bar #rframe{top:0}
#reader.hide-bar.peek #rbar{transform:none}
.fl{position:absolute;top:calc(10px + env(safe-area-inset-top,0px));z-index:6;display:none;opacity:.55}
.fl .circ{width:40px;height:40px}
#flL{left:max(10px,env(safe-area-inset-left,0px))}#flR{right:max(10px,env(safe-area-inset-right,0px))}
#reader[data-mode="focus"] .fl{display:block}
#reader.peek .fl{display:none!important}
#grab{position:absolute;top:0;left:50%;transform:translateX(-50%);width:160px;height:26px;z-index:6;display:none}
#grab::after{content:"";position:absolute;left:50%;top:7px;width:52px;height:5px;margin-left:-26px;border-radius:3px;background:rgba(120,120,130,.55)}
#reader[data-mode="full"] #grab{display:block}
#reader.peek #grab{display:none}

/* menus */
#layer{position:fixed;inset:0;z-index:70;cursor:pointer}.menu{cursor:default}
#layer[hidden]{display:none}

#rbar,.menu,.tabs,.addpill,.search,.circ{

.menu:not([hidden]){animation:hrPop .46s cubic-bezier(.34,1.5,.5,1) backwards}

function hashKey(title,qs){let h=0;const sig=title+'|'+qs.length+'|'+(qs[0]?String(qs[0].q).slice(0,60):'');for(let i=0;i<sig.length;i++)h=(h*31+sig.charCodeAt(i))|0;return 'gt_'+h}
function extractCfg(t){const m=/\bRAW_CFG\s*=\s*/.exec(t);if(!m)return null;const i=m.index+m[0].length;if(t[i]!=='{')return null;
  let d=0,str=false,esc=false,j=i;
  for(;j<t.length;j++){const c=t[j];
    if(str){if(esc)esc=false;else if(c==='\\')esc=true;else if(c==='"')str=false}
    else if(c==='"')str=true;else if(c==='{')d++;else if(c==='}'){d--;if(!d){j++;break}}}
  try{return JSON.parse(t.slice(i,j))}catch(e){return null}}
function buildMeta(cfg){const tests=Array.isArray(cfg.tests)?cfg.tests:[cfg];
  return tests.filter(c=>c&&Array.isArray(c.questions)).map(c=>({key:hashKey(c.title,c.questions),n:c.questions.length,a:c.questions.map(q=>q.a),mc:c.mc==null?4:+c.mc,mw:c.mw==null?1:+c.mw}))}
const PAT={NEET_PG:{label:'NEET PG',mc:4,mw:1},INICET:{label:'INICET',mc:1,mw:0.33}};
const patOf=key=>{const p=LS.get('pat.'+key,null);return p&&PAT[p]?PAT[p]:null};
const r2=x=>Math.round(x*100)/100;
function one(t){let st=null;try{st=JSON.parse(localStorage.getItem(t.key))}catch(e){}
  if(!st||!st.phase||st.phase==='intro')return{k:'new'};
  const ans=st.ans||{};let c=0,w=0,at=0;
  for(const q in ans){at++;const A=t.a[q];if(A==null||A<0)continue;if(ans[q]===A)c++;else w++}
  const P=patOf(t.key),mc=P?P.mc:t.mc,mw=P?P.mw:t.mw;const max=t.a.filter(x=>x!=null&&x>=0).length*mc,score=r2(c*mc-w*mw);
  /* The completed badge reports question accuracy, not marks: pct is the rounded
     correct-question percentage and correct/n is correct answers / all questions. */
  const total=+t.n||0,correct=c,pct=total?Math.round(correct/total*100):0;
  return{k:(st.phase==='done'||st.phase==='review')?'done':'prog',score,max,at,n:total,correct,pct}}

  if(d.length===r.length){const correct=d.reduce((s,x)=>s+x.correct,0),total=d.reduce((s,x)=>s+x.n,0);return{k:'done',multi:1,done:d.length,total:r.length,correct,n:total,pct:total?Math.round(correct/total*100):0};}

function dirDone(path){let n=0;for(const f of S.files)if(inPath(f,path)&&prog(f).k==='done')n++;return n?' · '+n+' done':''}

async function scanAll(){if(scanning)return;scanning=true;let n=0;

const fileRow=(f,sub)=>{const g=prog(f),ok=g.k==='done',label=clean(f.name);return '<div class="row'+(ok?' rdone':'')+'" data-id="'+esc(f.id)+'"><button class="row-open" aria-label="Open '+esc(label)+'"><span class="fi'+(ok?' ok':'')+'">'+ico(ok?'check':'doc')+'</span><span class="tx"><span class="nm">'+esc(label)+'</span><span class="sz p">'+esc(sub)+'</span></span>'+badge(g)+(f.fav?ico('star','star'):'')+ico('chev','chev')+'</button>'+rowOptions(label)+'</div>'};

async function openCustomModule(){

    if(!blob){
      /* Read the 15 MB maker once. The service worker's shell cache is the
         fastest source; a force-cache fetch is the fallback. Never decode it
         to a JS string here — loadFrame() uses the Blob directly. */
      let response=null;
      if(typeof caches!=='undefined'&&caches.match){
        try{response=await caches.match(new URL('custom-module.html',location.href).href)}catch(e){}
      }
      if(!response){
        response=await fetch('custom-module.html',{cache:'force-cache'});
        if(!response.ok)throw new Error('custom-module.html was not found');
      }
      blob=await response.blob();
      builtinCustomModuleBlob=blob;
    }
    const f={id:'builtin-marrow-custom-module',name:'Marrow Custom Module',rel:[],size:blob.size,blob,fav:false,meta:null,builtin:true};
    S.cur=f;S.mode=S.set.display;S.net=S.set.net;

async function addFiles(fs){
  const total=fs.length;
  fs=fs.filter(f=>/\.(x?html?|shtml)$/i.test(f.name)||/html/.test(f.type));
  if(!fs.length){toast(total?'No .html files found in that selection.':'Choose files ending in .html or .htm.');return}
  const key=(rel,n)=>rel.join('/')+'/'+n;
  const have=new Map(S.files.map(x=>[key(relOf(x),x.name),x]));
  let add=0,upd=0;const tops=new Set();
  for(const f of fs){
    const rel=f.webkitRelativePath?f.webkitRelativePath.split('/').slice(0,-1):[];if(rel.length)tops.add(rel[0]);
    const ex=have.get(key(rel,f.name));
    if(ex){ex.blob=f;ex.size=f.size;ex.meta=undefined;dropMeta(ex.id);await DB.put(ex);upd++}
    else{const rec={id:uid(),name:f.name,rel,size:f.size,blob:f,fav:false,added:Date.now()};S.files.push(rec);have.set(key(rel,f.name),rec);await DB.put(rec);add++}}
  S.tab='my';S.path=[];S.q='';$('#q').value='';
  render();
  const where=tops.size===1?' from '+clean([...tops][0]):'';
  toast(fs.length===1&&!tops.size?'Added '+clean(fs[0].name):(add?'Added '+add+' file'+(add===1?'':'s'):'')+(add&&upd?', ':'')+(upd?'Updated '+upd:'')+where);
  scanAll();try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}}

function decodeBytes(buf){
  const u=new Uint8Array(buf);
  if(u[0]===0xEF&&u[1]===0xBB&&u[2]===0xBF)return new TextDecoder('utf-8').decode(u.subarray(3));
  if(u[0]===0xFF&&u[1]===0xFE)return new TextDecoder('utf-16le').decode(u.subarray(2));
  if(u[0]===0xFE&&u[1]===0xFF)return new TextDecoder('utf-16be').decode(u.subarray(2));
  try{return new TextDecoder('utf-8',{fatal:true}).decode(u)}catch(e){}
  const m=/charset\s*=\s*["']?([\w-]+)/i.exec(new TextDecoder('latin1').decode(u.subarray(0,2048)));
  if(m){try{return new TextDecoder(m[1]).decode(u)}catch(e){}}
  return new TextDecoder('windows-1252').decode(u)}

/* Runs inside the opened page. Puts "i) ii) iii)" points, and unlabelled "Label- value" lines
   that follow a question, one below the other. Written without line comments because it is flattened to one line. */
function FMT(){
  var R=['i','ii','iii','iv','v','vi','vii','viii','ix','x','xi','xii','xiii','xiv','xv','xvi','xvii','xviii','xix','xx'];
  var RU=R.map(function(x){return x.toUpperCase();}),L=[],U=[],D=[],c;
  for(c=0;c<26;c++){L.push(String.fromCharCode(97+c));U.push(String.fromCharCode(65+c));}
  for(c=1;c<=30;c++){D.push(String(c));}
  var FAM=[R,RU,L,U,D];
  var MK=/(^|[\s.,;:?!])\(?([ivxIVX]{1,5}|[a-zA-Z]|\d{1,2})(\)|\.(?=\s))/g;
  var DASH=/^[-–—:]$/, ENDDASH=/[^\s][-–—:]$/, PUNCT=/[.?!:]$/;
  var STARTERS=/^(What|Which|Who|Whom|Whose|How|Why|When|Where|Identify|Choose|Select|Name|Predict|Find)$/;
  function points(t){
    var ms=[],m;MK.lastIndex=0;
    while((m=MK.exec(t))){ms.push({at:m.index+m[1].length,tok:m[2],d:m[3].charAt(0)});}
    for(var f=0;f<FAM.length;f++){
      for(var di=0;di<2;di++){
        var dl=di?'.':')',seq=[],n=0;
        for(var i=0;i<ms.length;i++){if(ms[i].d===dl&&n<FAM[f].length&&ms[i].tok===FAM[f][n]){seq.push(ms[i].at);n++;}}
        if(seq.length>=2){return seq;}
      }
    }
    return null;
  }
  function buildPoints(t,seq){
    var parts=[],pre=t.slice(0,seq[0]).replace(/\s+$/,'');
    if(pre){parts.push(pre);}
    for(var i=0;i<seq.length;i++){parts.push(t.slice(seq[i],i+1<seq.length?seq[i+1]:t.length).replace(/^\s+|\s+$/g,''));}
    var last=parts[parts.length-1],m=/^([^]{3,}?[.!])\s+([A-Z][^]*\?)$/.exec(last);
    if(!m){m=/^([^]{3,}?)\s+((?:What|Which|Who|Whom|Whose|How|Why|When|Where|Identify|Choose|Select|Name|Predict|Find)\b[^?]*\?)$/.exec(last);}
    if(m){parts[parts.length-1]=m[1];parts.push(m[2]);}
    return parts;
  }
  function buildLines(t){
    var tk=t.replace(/^\s+|\s+$/g,'').split(/\s+/),sp=[],le=[],st=[],i,k;
    if(tk.length<5||t.length>1200){return null;}
    for(i=0;i<tk.length-1;i++){
      if(DASH.test(tk[i])){if(i>0){sp.push(i);le.push(i-1);st.push(true);}}
      else if(ENDDASH.test(tk[i])){sp.push(i);le.push(i);st.push(false);}
    }
    var s2=[],l2=[],t2=[];
    for(k=0;k<sp.length;k++){if(!(k+1<sp.length&&sp[k+1]===sp[k]+1)){s2.push(sp[k]);l2.push(le[k]);t2.push(st[k]);}}
    sp=s2;le=l2;st=t2;
    if(sp.length<2){return null;}
    var ps=0;
    for(i=le[0]-1;i>=0;i--){if(PUNCT.test(tk[i])){ps=i+1;break;}}
    var ls=[ps];
    if(le[0]-ps+1>4){
      ls[0]=le[0];
      for(i=le[0]-3;i<=le[0];i++){if(i>=ps&&/^[A-Z]/.test(tk[i])){ls[0]=i;break;}}
    }
    if(st[0]&&!/^[A-Z]/.test(tk[ls[0]])){return null;}
    for(k=1;k<sp.length;k++){
      var vs=sp[k-1]+1,j=le[k];
      for(var x=vs+1;x<=le[k];x++){if(/^[A-Z]/.test(tk[x])){j=x;break;}}
      if(j<=vs){return null;}
      if(st[k]&&!/^[A-Z]/.test(tk[j])){return null;}
      ls.push(j);
    }
    var foot=tk.length,end=tk.length-1,lv=sp[sp.length-1]+1;
    if(/\?$/.test(tk[end])){
      for(i=lv+1;i<tk.length;i++){
        if(STARTERS.test(tk[i])||(PUNCT.test(tk[i-1])&&/^[A-Z]/.test(tk[i])&&tk[i-1]!==':')){foot=i;break;}
      }
    }
    var out=[];
    if(ls[0]>0){out.push(tk.slice(0,ls[0]).join(' '));}
    for(k=0;k<ls.length;k++){
      var e=k+1<ls.length?ls[k+1]:foot;
      out.push(tk.slice(ls[k],e).join(' '));
    }
    if(foot<tk.length){out.push(tk.slice(foot).join(' '));}
    return out;
  }
  function buildNewlines(t){
    var q=t.lastIndexOf('?');
    if(q<0){return null;}
    var tl=t.slice(q+1);
    if(tl.length<6||tl.length>500){return null;}
    var rows=tl.split(/\s*\n\s*/).filter(function(x){return /\S/.test(x);});
    if(rows.length<2||rows.length>12||rows.some(function(r){return r.length>150;})){return null;}
    return [t.slice(0,q+1).replace(/\s+$/,'')].concat(rows);
  }
  function put(node,parts){
    var s=document.createElement('span');s.setAttribute('data-hrp','1');
    for(var i=0;i<parts.length;i++){if(i){s.appendChild(document.createElement('br'));}s.appendChild(document.createTextNode(parts[i]));}
    node.parentNode.replaceChild(s,node);
  }
  function pass(){
    if(!document.body){return;}
    var w=document.createTreeWalker(document.body,NodeFilter.SHOW_TEXT,null),n,list=[];
    while((n=w.nextNode())){
      var p=n.parentNode;

      list.push(n);
    }
    for(var i=0;i<list.length;i++){
      var t=list[i].nodeValue,s=points(t),parts=null;
      if(s){parts=buildPoints(t,s);}else{parts=buildLines(t)||buildNewlines(t);}
      if(parts&&parts.length>1){put(list[i],parts);}
    }
  }
  var tm=0;
  function sched(){clearTimeout(tm);tm=setTimeout(pass,40);}
  new MutationObserver(sched).observe(document.documentElement,{childList:true,subtree:true,characterData:true});
  document.addEventListener('DOMContentLoaded',sched);
  addEventListener('load',sched);
}

/* ---------- Grand Test: mandatory NEET PG / INICET pattern ----------
   NEET PG: +4 / -1 / 0     INICET: +1 / -0.33 / 0
   Asked only for Grand Tests, once per fresh attempt. After the test is started the choice is locked. */
function cfgSpan(t){const m=/\bRAW_CFG\s*=\s*/.exec(t);if(!m)return null;const i=m.index+m[0].length;if(t[i]!=='{')return null;
  let d=0,str=false,esc=false,j=i;
  for(;j<t.length;j++){const c=t[j];
    if(str){if(esc)esc=false;else if(c==='\\')esc=true;else if(c==='"')str=false}
    else if(c==='"')str=true;else if(c==='{')d++;else if(c==='}'){d--;if(!d){j++;break}}}
  return d?null:[i,j]}
function isGrand(name,cfg,metas){
  const titles=(Array.isArray(cfg.tests)?cfg.tests:[cfg]).map(c=>c&&c.title||'').join(' ');
  return /grand/i.test(name)||/grand/i.test(titles)||metas.some(m=>m.n>=150)}

/* Returns false when the person cancels (the test is not opened). */
async function ensurePattern(f){
  if(!f||f.mcqLookup||!f.blob)return true;
  let text;try{text=decodeBytes(await f.blob.arrayBuffer())}catch(e){return true}
  const cfg=extractCfg(text);if(!cfg)return true;
  const metas=buildMeta(cfg);if(!metas.length)return true;
  if(!isGrand(f.name,cfg,metas))return true;
  if(!isFresh(metas))return true;           /* already started or completed: pattern stays locked */
  const choice=await askPattern(clean(f.name));
  if(!choice)return false;
  metas.forEach(m=>LS.set('pat.'+m.key,choice));
  return true}
/* Writes the chosen marks into the test's RAW_CFG before it loads. Tests without a stored choice are left untouched. */
function applyPattern(text){
  const sp=cfgSpan(text);if(!sp)return text;
  let cfg;try{cfg=JSON.parse(text.slice(sp[0],sp[1]))}catch(e){return text}
  const list=Array.isArray(cfg.tests)?cfg.tests:[cfg];let changed=false;
  list.forEach(c=>{if(!c||!Array.isArray(c.questions))return;const P=patOf(hashKey(c.title,c.questions));if(P){c.mc=P.mc;c.mw=P.mw;changed=true}});
  if(!changed)return text;
  let out=text.slice(0,sp[0])+JSON.stringify(cfg).replace(/</g,'\\u003c')+text.slice(sp[1]);
  /* fractional marks (-0.33): round displayed totals to 2 decimals, e.g. 97.67 not 97.67000000000001 */
  const R=(a,b)=>{out=out.split(a).join(b)};
  R('const ALL_TESTS = ','const R2=x=>Math.round(x*100)/100;const ALL_TESTS = ');
  R('score:c*CFG.mc-w*CFG.mw}','score:R2(c*CFG.mc-w*CFG.mw)}');
  R('sc+=s.score;','sc=R2(sc+s.score);');
  R('+(m.c*CFG.mc-m.w*CFG.mw)+','+R2(m.c*CFG.mc-m.w*CFG.mw)+');
  R('gNet=gok*CFG.mc-gno*CFG.mw;','gNet=R2(gok*CFG.mc-gno*CFG.mw);');
  R('+(c*CFG.mc)+','+R2(c*CFG.mc)+');
  R('+(w*CFG.mw)+','+R2(w*CFG.mw)+');
  R('m.sc=m.c*CFG.mc-m.w*CFG.mw;','m.sc=R2(m.c*CFG.mc-m.w*CFG.mw);');
  return out}

function upgradeReview(t){
  try{
    if(typeof t!=='string'||t.indexOf('id="fpanel"')>=0||t.indexOf('function review()')<0)return t;
    const reFrow=/'<div class="frow">[^\n]*?'\+fdd\+'<\/div>'\+/;
    const reH1=/[ \t]*document\.getElementById\('fsub'\)\.onchange=[^\n]*\r?\n[ \t]*document\.getElementById\('fsec'\)\.onchange=[^\n]*\r?\n/;
    const reH2=/[ \t]*const fddEl=document\.getElementById\('fdd'\);\r?\n[^\n]*'fbtn'[^\n]*\r?\n[^\n]*'fbd'[^\n]*\r?\n[^\n]*querySelectorAll\('\.fi'\)[^\n]*\r?\n/;
    if(!reFrow.test(t)||!reH1.test(t)||!reH2.test(t))return t;
    const a=t.indexOf("const subOpts='<option value=\"all\">All ");
    const fd=a<0?-1:t.indexOf("const fdd='<div class=\"fdd\" id=\"fdd\">",a);
    const endMark="</div></div>';";
    const e=fd<0?-1:t.indexOf(endMark,fd);
    const sty=t.indexOf('</style>');
    if(a<0||fd<0||e<0||e-a>4000||sty<0)return t;
    let out=t.slice(0,a)+RV_A+'\n'+t.slice(e+endMark.length).replace(/^[ \t]*\r?\n?/,'');
    out=out.replace(reFrow,()=>RV_FROW).replace(reH1,()=>'').replace(reH2,()=>RV_B+'\n');
    const s2=out.indexOf('</style>');
    return out.slice(0,s2)+RV_CSS+'\n'+out.slice(s2);
  }catch(err){return t}
}

async function openFile(id){
  const f=S.files.find(x=>x.id===id);if(!f)return;
  if(!(await ensurePattern(f)))return;
  S.cur=f;S.mode=S.set.display;S.net=S.set.net;
  $('#rTitle').textContent=clean(f.name);$('#reader').hidden=false;document.body.style.overflow='hidden';
  setMode(S.mode,true);await loadFrame()}
async function loadFrame(){
  const f=S.cur;if(!f)return;
  try{
    if(f.mcqLookup)S.mcqNonce=uid();
    let markupBlob,srcdoc=null;
    if(f.builtin){
      /* The 15 MB maker already carries its own offline CSP and needs no
         review/upgrade/head injection. Reusing the cached Blob avoids a second
         15 MB decode, several full-page regex scans and a second Blob copy.
         applyFont() injects the zoom style into the iframe on load. */
      S.runner=false;
      markupBlob=f.blob;
    }else{
      let text=f.mcqLookup?mcqLookup.buildHTML(f.mcqQuestion,S.mcqNonce,f.bookmarkNav):decodeBytes(await f.blob.arrayBuffer());
      if(!f.mcqLookup)text=upgradeReview(applyPattern(text));
      S.runner=!!f.mcqLookup||/\bRAW_CFG\s*=/.test(text)||(/id=["']root["']/.test(text)&&/qn-row/.test(text));
      const head=zoomTag()+(S.net?'':CSP_OFF)+(S.net&&S.set.fix?'<meta name="referrer" content="no-referrer">'+imgfixTag:'')+(S.set.fmt&&!f.builtin?fmtTag:'')+bookmarkTag;
      const markup=head?injectHead(text,head):text;
      if(f.mcqLookup)srcdoc=markup;
      markupBlob=new Blob([markup],{type:'text/html;charset=utf-8'});
    }
    const url=f.mcqLookup?null:URL.createObjectURL(markupBlob);
    if(S.url)URL.revokeObjectURL(S.url);S.url=url;
    const box=$('#rframe');box.innerHTML='';
    const fr=document.createElement('iframe');fr.title=f.name;fr.setAttribute('sandbox',SANDBOX);fr.setAttribute('allow','fullscreen; autoplay; clipboard-read; clipboard-write; geolocation');fr.allowFullscreen=true;fr.addEventListener('load',()=>{applyFont();syncTopEdge()});if(f.mcqLookup)fr.srcdoc=srcdoc;else fr.src=url;box.appendChild(fr);applyFont()
  }catch(e){toast('This file could not be opened: '+e.message)}}

/* Font size: on test pages the slider raises the REAL font-size of the question, the options and
   the buttons below them. The page is re-laid-out and re-rendered at the new size — never zoomed,
   scaled or bitmap-stretched — so the font stays completely sharp at every step.
   The test's top bar (title, timer, progress, All-questions and End-test controls) keeps its
   normal size. Any page that is not a test gets whole-page zoom as before. */
const FONTS=[60,70,80,90,100,110,125,150,175,200,250];
/* The reference question layout, forced on every test page (library tests, custom modules and
   searched MCQs). <main> is the scrollable area and holds the question AND the options: the
   question block grows, so short questions keep the options low on screen while tall content
   (big images) simply scrolls — options are always reachable without losing the button row.
   #root.answered (single MCQ after answering) lets the review flow from the top instead.
   #root>.page covers the review/results/start screens, whose .page must scroll in its own box
   (flex-basis 0, like main) so toTop() works and Next always opens at the top of the question. */
const RUNNER_LAYOUT=
  '#root{height:auto!important;min-height:100%!important;display:flex!important;flex-direction:column!important}'+
  '#root>header{flex:none!important}'+
  '#root>main{flex:1 1 0!important;min-height:0!important;overflow:auto!important;display:flex!important;flex-direction:column!important;-webkit-overflow-scrolling:touch}'+
  '#root>main>.q{flex:1 1 auto!important}'+
  '#root.answered>main>.q{flex:0 0 auto!important}'+
  '#root>.page{flex:1 1 0!important;min-height:0!important;overflow:auto!important;-webkit-overflow-scrolling:touch}'+
  '#root>.opts,#root>.nav{flex:none!important}';
/* Real font-size scaling for test pages. .q = question text, .opt = options, .btn = the buttons
   below the options, .ex = explanation. The header, timer, question counter, progress bar and
   palette are deliberately not in this list, so the taskbar never grows. */
function runnerScaleCss() {
  const p = Math.max(60, Math.min(250, +S.set.font || 100));
  const z = p / 100;
  /* Question stems, option text, option labels and explanations read this variable in
     MARROW_CSS, so each one keeps its own 20/16/11/16px base size at every setting.
     No zoom or transform is applied to a test page. */
  const scale = '#root{--hr-fs:' + z + '}';
  if (p === 100) return scale;
  return scale+
    '#root .rv .mk{font-size:calc(12.5px*var(--hr-fs))!important}'+
    '#root .btn{font-size:calc(14px*var(--hr-fs))!important}'+
    '#root .answer-result{font-size:calc(15px*var(--hr-fs))!important}'+
    '#root .choice-mark{font-size:calc(12px*var(--hr-fs))!important}'+
    '#root .nav #savedState{font-size:calc(13px*var(--hr-fs))!important}';
}
function zoomCss() {
  const p = +S.set.font || 100;
  if (!S.runner) return p === 100 ? '' : 'html{zoom:' + (p / 100) + ' !important}';
  return RUNNER_LAYOUT + runnerScaleCss();
}
